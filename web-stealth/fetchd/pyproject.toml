[project]
name = "fetchd"
version = "0.1.0"
description = "Web retrieval sidecar for the @local/web-stealth harness plugin."
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.16,<0.17",
    "nodriver==0.50.5",
    "beautifulsoup4>=4.13",
    "pypdf>=6.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fetchd"]
